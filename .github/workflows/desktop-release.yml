name: Desktop release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--bundles dmg,app"
            artifact: nas-llm_dmg
          - platform: windows-latest
            args: "--bundles msi,nsis"
            artifact: nas-llm_windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build and bundle (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: desktop
        # Unsigned builds for local testing. To sign + notarize, add an `env:`
        # block here with APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD /
        # APPLE_TEAM_ID secrets and uncomment them.
        run: npx tauri build ${{ matrix.args }}

      - name: Build and bundle (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: desktop
        run: npx tauri build ${{ matrix.args }}
        shell: pwsh

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
