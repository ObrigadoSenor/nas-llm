# nas-llm — single secure public OpenAI-compatible endpoint for the
# UGREEN NASync DXP2800 (Intel N100, 8 GB).
#
# Three containers on one internal Docker network. Ollama is NEVER published
# to the host: only Caddy can reach it, and only /v1/* is exposed.
#
# Phased deploy:
#   - Phase 2 (LAN):  `docker compose up -d`              -> ollama + caddy
#   - Phase 4 (tunnel): set TUNNEL_TOKEN in .env, then
#                       `docker compose --profile tunnel up -d`  -> + cloudflared
# deploy.sh enables the tunnel profile automatically when TUNNEL_TOKEN is set.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # NO `ports:` mapping. Port 11434 is reachable only inside the `internal`
    # network. OLLAMA_HOST=0.0.0.0 binds inside the container namespace only;
    # because nothing is published, the host and LAN cannot reach it.
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - ${DOCKER_VOLUME}/docker/nas-llm/ollama:/root/.ollama
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - ollama
      - backend
    # Host port 8080 for LAN verification (phase 2). Avoid 9000 (UGOS console).
    # Optional hardening (phase 7): drop this mapping once the tunnel is up so
    # Caddy is reachable only by cloudflared over the internal network.
    ports:
      - "8080:8080"
    environment:
      API_BEARER_TOKEN: ${API_BEARER_TOKEN}
      EXTENSION_ORIGIN: ${EXTENSION_ORIGIN:-*}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/chat:ro   # minimal chat UI
      - ${DOCKER_VOLUME}/docker/nas-llm/caddy/data:/data
      - ${DOCKER_VOLUME}/docker/nas-llm/caddy/config:/config
    networks:
      - internal

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      - ollama
      - searxng
    # No ports: — only Caddy reaches it over the internal network.
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-https://chat.selected.systems}
      MAIL_FROM: ${MAIL_FROM:-noreply@selected.systems}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      DB_PATH: /data/nas-llm.db
      OLLAMA_URL: http://ollama:11434
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # Model-management fit/perf guidance. OLLAMA_CONTEXT_LENGTH must mirror the
      # ollama service value above so the backend estimates KV-cache RAM correctly.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      NAS_RAM_GB: ${NAS_RAM_GB:-8}
      NAS_SYSTEM_RESERVE_GB: ${NAS_SYSTEM_RESERVE_GB:-1.5}
      # Optional remote Mac backend (leave OLLAMA_MAC_URL empty for NAS-only).
      OLLAMA_MAC_URL: ${OLLAMA_MAC_URL:-}
      MAC_RAM_GB: ${MAC_RAM_GB:-16}
      MAC_SYSTEM_RESERVE_GB: ${MAC_SYSTEM_RESERVE_GB:-2}
      # Everything below is read by backend/main.go but used to be absent from
      # this block, so setting it in .env silently did nothing and the backend
      # fell back to its compiled default. Each default here mirrors the
      # corresponding default in the `config` struct in backend/main.go — keep
      # the two in sync, or .env will appear to lie again.
      #
      # Web search.
      MAX_SEARCH_ROUNDS: ${MAX_SEARCH_ROUNDS:-1}
      # Clarifying questions / ask_user.
      MAX_CLARIFY_ROUNDS: ${MAX_CLARIFY_ROUNDS:-3}
      ASK_USER_IN_PLAIN_CHAT: "${ASK_USER_IN_PLAIN_CHAT:-true}"
      CLARIFY_PROSE_DETECT: "${CLARIFY_PROSE_DETECT:-true}"
      # Agent harness. FETCH_PAGE_ENABLED stays off unless explicitly set: it
      # lets the model read untrusted web pages, which raises the
      # prompt-injection surface. See .env.example for the full rationale.
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-24}
      FETCH_PAGE_ENABLED: "${FETCH_PAGE_ENABLED:-false}"
      # Concurrent chats + human-in-the-loop timeouts (Go duration syntax).
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      BROWSER_RELAY_GRACE: ${BROWSER_RELAY_GRACE:-45s}
      AGENT_JOB_TIMEOUT: ${AGENT_JOB_TIMEOUT:-30m}
      TOOL_EXEC_TIMEOUT: ${TOOL_EXEC_TIMEOUT:-15m}
      RUN_COMMAND_TIMEOUT: ${RUN_COMMAND_TIMEOUT:-120s}
    volumes:
      - ${DOCKER_VOLUME}/docker/nas-llm/backend/data:/data
    networks:
      - internal

  # SearXNG meta-search backend for the web_search tool. Internal-only:
  # only the `backend` container reaches it (http://searxng:8080). Never
  # published to the host/LAN. Pinned tag — `latest` breaks monthly.
  searxng:
    image: searxng/searxng:2026.9.8-3fdc6d753
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # Only started with `--profile tunnel` (phase 4, once TUNNEL_TOKEN is set).
    profiles: ["tunnel"]
    command: ["--no-autoupdate", "tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - caddy
    networks:
      - internal

networks:
  internal:
    driver: bridge
