<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>nas-llm</title>
<link rel="stylesheet" href="vendor/highlight-github-dark.min.css">
<link rel="stylesheet" href="styles.css?v=25">
<script defer src="vendor/highlight.min.js"></script>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <h1>nas-llm</h1>
    <p>Sign in with a one-time link emailed to you. No password.</p>
    <div class="row">
      <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email">
      <button id="loginBtn">Send link</button>
    </div>
    <div id="loginInfo"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div id="sideHead">
      <button id="newChat"></button>
      <button id="newFolder" title="New folder"></button>
      <button id="closeSide" title="Close"></button>
    </div>
    <div id="convList"></div>
    <div class="gap"></div>
    <div id="who">
      <span id="whoEmail"></span>
      <button id="logout"></button>
    </div>
  </aside>
  <div id="scrim" class="hidden"></div>
  <main>
    <header>
      <button id="menuBtn" title="Menu"></button>
      <h1 id="chatTitle">nas-llm</h1>
      <span id="chatMeta"></span>
      <div class="gap"></div>
      <select id="model" title="model"></select>
      <button id="manageModels" title="Manage models" aria-label="Manage models"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></button>
    </header>
    <div id="chat"></div>
    <div class="composer">
      <div id="pills" class="pills hidden"></div>
      <div id="imgPills" class="img-pills hidden"></div>
      <div class="input-wrap">
        <button id="plusBtn" class="plus-btn" title="Add tools" aria-label="Add tools" aria-expanded="false"></button>
        <div id="plusPopup" class="plus-popup hidden" role="menu"></div>
        <textarea id="input" placeholder="" rows="1"></textarea>
        <button id="attachBtn" class="attach-btn hidden" title="Attach image" aria-label="Attach image"></button>
        <input id="fileInput" type="file" accept="image/*" multiple class="hidden">
        <button id="send"></button>
      </div>
    </div>
  </main>
</div>

<div id="agentModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>Agent settings</h2>
      <div class="gap"></div>
      <button id="closeAgent" title="Close"></button>
    </div>
    <div class="modal-body">
      <div class="agent-cfg-note muted">These apply to every Agent-mode run (per-chat overrides come later). The model, tools, and budget make the agent — pick a small tool set for a small local model.</div>
      <label class="agent-label" for="agentSystem">System prompt</label>
      <textarea id="agentSystem" rows="5" placeholder="Leave blank to use the built-in agent prompt (injects today's date and steers toward few tool calls)."></textarea>
      <label class="agent-label">Tools</label>
      <div id="agentTools" class="agent-tools"></div>
      <div class="agent-cfg-actions">
        <button id="saveAgent">Save</button>
      </div>
      <div id="agentSaved" class="agent-saved muted hidden">Saved.</div>
    </div>
  </div>
</div>

<div id="modelsModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>Models</h2>
      <div class="gap"></div>
      <button id="closeModels" title="Close"></button>
    </div>
    <div class="modal-tabs">
      <button id="tabInstalled" class="modal-tab active">Installed</button>
      <button id="tabBrowse" class="modal-tab">Browse</button>
    </div>
    <div class="modal-body">
      <div id="pullStatus" class="pull-status hidden"></div>
      <div id="tabBody"></div>
    </div>
  </div>
</div>

<script type="module" src="app.js?v=25"></script>
</body>
</html>
