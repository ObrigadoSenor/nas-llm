<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>nas-llm</title>
<link rel="stylesheet" href="vendor/highlight-github-dark.min.css">
<link rel="stylesheet" href="styles.css">
<script defer src="vendor/highlight.min.js"></script>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <h1>nas-llm</h1>
    <p>Sign in with a one-time link emailed to you. No password.</p>
    <div class="row">
      <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email">
      <button id="loginBtn">Send link</button>
    </div>
    <div id="loginInfo"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div id="sideHead">
      <button id="newChat"></button>
      <button id="newFolder" title="New folder"></button>
      <button id="closeSide" title="Close"></button>
    </div>
    <div id="convList"></div>
    <div class="gap"></div>
    <div id="who">
      <span id="whoEmail"></span>
      <button id="logout"></button>
    </div>
  </aside>
  <div id="scrim" class="hidden"></div>
  <main>
    <header>
      <button id="menuBtn" title="Menu"></button>
      <h1 id="chatTitle">nas-llm</h1>
      <span id="chatMeta"></span>
      <div class="gap"></div>
      <select id="model" title="model"></select>
      <button id="manageModels" title="Manage models"></button>
    </header>
    <div id="chat"></div>
    <div class="form">
      <button id="searchToggle" class="toggle" title="Toggle web search (looks up fresh info via SearXNG)" aria-pressed="false"></button>
      <textarea id="input" placeholder="" rows="1"></textarea>
      <button id="send"></button>
    </div>
  </main>
</div>

<div id="modelsModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>Models</h2>
      <div class="gap"></div>
      <button id="closeModels" title="Close"></button>
    </div>
    <div class="modal-tabs">
      <button id="tabInstalled" class="modal-tab active">Installed</button>
      <button id="tabBrowse" class="modal-tab">Browse</button>
    </div>
    <div class="modal-body">
      <div id="pullStatus" class="pull-status hidden"></div>
      <div id="tabBody"></div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
